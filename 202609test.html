<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>九龙坡支行9月柜面业务考试复习题</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Microsoft YaHei;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;width:100%}
body{background:#f5f7fa;font-size:14px;color:#333;width:100%}
/* 滚动条样式：不占宽度，防止内容区宽度跳变 */
::-webkit-scrollbar{width:6px;height:6px;-webkit-appearance:none}
::-webkit-scrollbar-thumb{background:#cbd5e0;border-radius:3px}
::-webkit-scrollbar-track{background:transparent}
*{scrollbar-width:thin;scrollbar-color:#cbd5e0 transparent}
/* 三段式布局容器：手机端撑满宽度，宽屏端限制720px居中 */
/* dvh=动态视口高度，随地址栏显隐自动调整，解决手机浏览器底部被遮问题；--vh为JS兜底；vh为旧浏览器回退 */
.app-wrap{display:flex;flex-direction:column;height:100vh;height:100dvh;height:var(--vh,100dvh);width:100%;max-width:720px;margin:0 auto;background:#fff;box-shadow:0 0 10px rgba(0,0,0,.05);overflow:hidden}
/* ===== 顶部固定头部 ===== */
.app-header{flex-shrink:0;background:#fff;border-bottom:1px solid #e2e8f0;padding:8px 12px}
.header-row1{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.user-box{display:flex;align-items:center;gap:4px;background:#edf2f7;border-radius:16px;padding:4px 10px;font-size:12px;cursor:pointer;flex-shrink:0;max-width:120px;overflow:hidden;white-space:nowrap}
.user-box:hover{background:#e2e8f0}
.user-icon{font-size:14px}
#userName{overflow:hidden;text-overflow:ellipsis}
.mode-switch{display:flex;gap:4px;flex:1}
.mode-btn{flex:1;padding:5px 4px;border:none;border-radius:16px;background:#e0e6ed;color:#4a5568;font-size:12px;cursor:pointer;text-align:center}
.mode-btn.active{background:#3182ce;color:#fff}
.module-select{width:100%;padding:5px 8px;border:1px solid #cbd5e0;border-radius:6px;background:#fff;font-size:12px;color:#4a5568;cursor:pointer}
/* 信息栏（可折叠） */
.info-bar{flex-shrink:0;background:#f7fafc;border-bottom:1px solid #e2e8f0}
.info-summary{display:flex;align-items:center;gap:8px;padding:6px 12px;font-size:12px;color:#4a5568;cursor:pointer;flex-wrap:wrap}
.info-summary:hover{background:#edf2f7}
.info-summary .arrow{transition:transform .2s;font-size:10px}
.info-bar.expanded .info-summary .arrow{transform:rotate(90deg)}
.info-summary .pill{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:1px 8px;font-size:11px}
.info-summary .pill.active{background:#3182ce;color:#fff;border-color:#3182ce}
.info-detail{display:none;padding:8px 12px;border-top:1px solid #e2e8f0}
.info-bar.expanded .info-detail{display:block}
.filter-row{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;align-items:center}
.filter-row select,.filter-row button{padding:4px 8px;border:1px solid #cbd5e0;border-radius:6px;background:#fff;font-size:11px;cursor:pointer}
.filter-row button.active{background:#e53e3e;color:#fff;border-color:#e53e3e}
.filter-row label{font-size:11px;color:#718096;display:flex;align-items:center;gap:3px;cursor:pointer}
.filter-row select{flex:1;min-width:90px}
.q-legend{display:flex;gap:8px;font-size:10px;color:#718096;margin-bottom:6px;flex-wrap:wrap}
/* 题号网格（紧凑，只显示当前题附近+汇总） */
.q-grid{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.q-dot{width:24px;height:24px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:10px;border:1px solid #cbd5e0;background:#fff;color:#4a5568;cursor:pointer;user-select:none;flex-shrink:0}
.q-dot:hover{border-color:#3182ce}
.q-dot.current{border-color:#3182ce;background:#ebf8ff;color:#2b6cb0;font-weight:bold}
.q-dot.right{border-color:#38a169;background:#d4f8e8;color:#276749}
.q-dot.wrong{border-color:#e53e3e;background:#ffe5e5;color:#c53030}
.q-dot.in-wrong-book{box-shadow:0 0 0 2px #e53e3e}
.q-dot.recite{border-style:dashed}
.q-dot.ellipsis{border:none;background:transparent;cursor:default;color:#a0aec0;width:auto;padding:0 2px}
.q-stats{width:100%;margin-top:6px;padding-top:6px;border-top:1px dashed #e2e8f0;font-size:11px;color:#718096;display:flex;gap:12px;flex-wrap:wrap}
/* ===== 内容区（弹性填充） ===== */
.app-content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px;width:100%;scrollbar-gutter:stable}
.question-card{border:1px solid #e2e8f0;border-radius:6px;padding:12px;width:100%}
.question-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:4px}
.question-type{display:inline-block;padding:2px 7px;font-size:11px;border-radius:3px}
.question-type.single{background:#ebf8ff;color:#3182ce}
.question-type.multi{background:#fef5e7;color:#dd6b20}
.question-type.judge{background:#e6fffa;color:#319795}
.question-type.recite{background:#faf5ff;color:#805ad5}
.question-category{font-size:11px;color:#718096}
.question-text{margin:8px 0;line-height:1.55;font-size:14px}
.question-note{font-size:12px;color:#c53030;background:#fff5f5;padding:7px;border-radius:4px;margin:6px 0;display:none;line-height:1.5}
/* 选项（移动端压缩） */
.options-list{display:flex;flex-direction:column;gap:6px;margin:10px 0;width:100%}
.option-item{padding:8px 10px;border:1.5px solid #e2e8f0;border-radius:6px;display:flex;align-items:flex-start;gap:8px;cursor:pointer;transition:all .15s;font-size:13px;line-height:1.4}
.option-item:hover{border-color:#90cdf4;background:#f7fafc}
.option-item.selected{background:#ebf8ff;border-color:#3182ce}
.option-item.correct{background:#d4f8e8;border-color:#38a169;font-weight:bold;cursor:default}
.option-item.wrong-selected{background:#ffd6d6;border-color:#e53e3e;color:#c53030;font-weight:bold;cursor:default}
.option-item.disabled{cursor:not-allowed;opacity:0.85}
.option-item.disabled:hover{border-color:#e2e8f0;background:transparent}
.option-letter{min-width:20px;height:20px;border-radius:50%;background:#e2e8f0;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.option-item.correct .option-letter{background:#38a169;color:#fff}
.option-item.wrong-selected .option-letter{background:#e53e3e;color:#fff}
.option-tag{margin-left:auto;font-weight:bold;flex-shrink:0}
.remove-wrong-btn{width:100%;padding:7px;border:1px solid #38a169;border-radius:6px;background:#fff;color:#38a169;font-size:12px;cursor:pointer;margin-top:6px}
.remove-wrong-btn:hover{background:#38a169;color:#fff}
/* 背诵卡片 */
.recite-card{border:1px solid #e2e8f0;border-radius:6px;padding:12px;width:100%}
.recite-group-title{font-size:14px;font-weight:bold;color:#553c9a;margin-bottom:8px;display:flex;align-items:center;gap:6px;cursor:pointer}
.recite-group-title .arrow{transition:transform .2s;font-size:11px}
.recite-group-title.collapsed .arrow{transform:rotate(-90deg)}
.recite-items{line-height:1.7;font-size:13px}
.recite-items.collapsed{display:none}
.recite-item{padding:5px 0;border-bottom:1px dashed #e2e8f0}
.recite-item:last-child{border-bottom:none}
.recite-item .mask{background:#2d3748;color:transparent;border-radius:3px;padding:0 3px;cursor:pointer;user-select:none}
.recite-item .mask.revealed{background:transparent;color:inherit}
.recite-toolbar{display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap}
.mastery-dot{display:inline-flex;gap:3px;align-items:center}
.mastery-btn{width:20px;height:20px;border-radius:50%;border:2px solid #cbd5e0;cursor:pointer;padding:0}
.mastery-btn.m1{background:#e53e3e;border-color:#e53e3e}
.mastery-btn.m2{background:#ecc94b;border-color:#ecc94b}
.mastery-btn.m3{background:#38a169;border-color:#38a169}
.mastery-btn.inactive{background:#fff}
.mastery-label{font-size:11px;color:#718096}
/* ===== 底部固定导航 ===== */
.app-footer{flex-shrink:0;background:#fff;border-top:1px solid #e2e8f0;padding:8px 12px;display:flex;gap:8px;align-items:center}
.footer-nav-btn{padding:10px 14px;border:1px solid #cbd5e0;border-radius:6px;background:#fff;color:#4a5568;font-size:13px;cursor:pointer;flex-shrink:0;min-width:64px}
.footer-nav-btn:disabled{opacity:0.4;cursor:not-allowed}
.footer-submit{flex:1;padding:10px;border:none;border-radius:6px;background:#3182ce;color:#fff;font-size:14px;cursor:pointer}
.footer-submit:disabled{background:#a0aec0;cursor:not-allowed}
.footer-pos{font-size:11px;color:#718096;text-align:center;flex-shrink:0;min-width:50px}
/* 弹窗 */
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;z-index:100;transition:opacity .2s}
.modal.active{opacity:1;visibility:visible}
.modal-content{background:#fff;border-radius:10px;padding:20px;width:90%;max-width:360px;text-align:center}
.modal-icon{font-size:36px;margin-bottom:10px}
.modal-icon.correct{color:#38a169}
.modal-icon.incorrect{color:#e53e3e}
.modal-msg{margin:8px 0;font-size:14px}
.modal-answer{background:#f7fafc;padding:8px;border-radius:6px;margin:10px 0;font-size:13px}
.modal-buttons{display:flex;gap:10px;margin-top:15px}
.modal-btn{flex:1;padding:9px;border:none;border-radius:6px;cursor:pointer;font-size:14px}
.modal-btn.primary{background:#3182ce;color:#fff}
.modal-btn.secondary{background:#e2e8f0;color:#4a5568}
.user-modal-content{max-width:340px}
.user-modal-content input{width:100%;padding:10px;border:1px solid #cbd5e0;border-radius:6px;margin:10px 0;font-size:14px}
.user-modal-content input:focus{outline:none;border-color:#3182ce}
.user-list{margin:10px 0;max-height:200px;overflow-y:auto}
.user-item{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border:1px solid #e2e8f0;border-radius:6px;margin-bottom:6px;cursor:pointer}
.user-item:hover{background:#ebf8ff;border-color:#3182ce}
.user-item .del{color:#e53e3e;cursor:pointer;font-size:16px;padding:0 4px}
.empty-hint{text-align:center;color:#a0aec0;padding:20px;font-size:13px}
</style>
</head>
<body>
<div class="app-wrap">
    <!-- 顶部固定头部 -->
    <div class="app-header">
        <div class="header-row1">
            <div class="user-box" onclick="openUserModal()">
                <span class="user-icon">👤</span>
                <span id="userName">未登录</span>
            </div>
            <div class="mode-switch">
                <button class="mode-btn active" id="mode-test" onclick="switchMode('test')">测试</button>
                <button class="mode-btn" id="mode-review" onclick="switchMode('review')">复习</button>
            </div>
        </div>
        <select class="module-select" id="moduleSelect" onchange="switchModule(this.value)"></select>
    </div>
    <!-- 信息栏（可折叠，默认收起） -->
    <div class="info-bar" id="infoBar">
        <div class="info-summary">
            <span class="arrow" onclick="toggleInfoBar()" style="cursor:pointer">▶</span>
            <span id="sumPos" onclick="toggleInfoBar()" style="cursor:pointer;flex-shrink:0">第1/0题</span>
            <input type="range" id="posSlider" min="1" max="1" value="1" oninput="onSliderInput(this.value)" style="flex:1;min-width:60px;height:20px;accent-color:#3182ce">
            <span class="pill" id="sumWrongBook" onclick="event.stopPropagation();quickToggleWrongBook()" style="cursor:pointer;border-color:#e53e3e;color:#e53e3e;flex-shrink:0">📕错题本(0)</span>
        </div>
        <div class="info-detail">
            <div class="q-legend">
                <span>🟩对</span><span>🟥错</span><span>⬜未</span><span>🔵当前</span><span>📕错题本</span>
            </div>
            <div class="q-grid" id="qgrid"></div>
            <button class="wrong-book-btn" id="wrongBookBtn" onclick="toggleWrongBook()" style="width:100%;margin-top:8px;padding:8px;border:1px solid #e53e3e;border-radius:6px;background:#fff;color:#e53e3e;font-size:13px;cursor:pointer">📕 只看错题（<span id="wrongCount">0</span>）</button>
        </div>
    </div>
    <!-- 内容区（弹性滚动） -->
    <div class="app-content" id="contentArea"></div>
    <!-- 底部固定导航 -->
    <div class="app-footer">
        <button class="footer-nav-btn" id="prev" onclick="goQuestion(-1)">＜上一题</button>
        <button class="footer-submit" id="footerSubmit" onclick="submitAnswer()">确认答案</button>
        <button class="footer-nav-btn" id="next" onclick="goQuestion(1)">下一题＞</button>
    </div>
</div>
<!-- 答题反馈弹窗 -->
<div class="modal" id="feedbackModal">
    <div class="modal-content">
        <div class="modal-icon" id="fbIcon"></div>
        <div class="modal-msg" id="fbMsg"></div>
        <div class="modal-answer" id="fbAnswer"></div>
        <div class="modal-buttons">
            <button class="modal-btn secondary" onclick="closeFeedback()">我再看看</button>
            <button class="modal-btn primary" onclick="closeFeedbackAndNext()">下一题</button>
        </div>
    </div>
</div>
<!-- 工号弹窗 -->
<div class="modal" id="userModal">
    <div class="modal-content user-modal-content">
        <input type="text" id="userInput" placeholder="请输入工号以保存进度，如0403003" onkeydown="if(event.key==='Enter')confirmUser()" style="margin-top:0">
        <div class="modal-buttons">
            <button class="modal-btn secondary" onclick="closeUserModal()">取消</button>
            <button class="modal-btn primary" onclick="confirmUser()">确定</button>
        </div>
    </div>
</div>
<script>
// ====== 题库数据 ======
const QUIZ_DATA = {
  "modules": [
    {
      "name": "九龙坡支行柜面业务测试题库（现金调缴实施细则）",
      "single": [
        {
          "question": "现金调缴业务办理核心原则（）",
          "options": {
            "D": "无需预约直接调款",
            "C": "先入库后记账",
            "B": "双人操作、监控全覆盖",
            "A": "单人操作、全程录像"
          },
          "answer": "B",
          "knowledge": "现金调缴基础规定"
        },
        {
          "question": "人行与本行办理现金存取使用系统为（）",
          "options": {
            "D": "反洗钱监测系统",
            "C": "大额支付系统",
            "B": "货二代现金交取款系统",
            "A": "综合业务系统"
          },
          "answer": "B",
          "knowledge": "行外人行调缴系统"
        },
        {
          "question": "现金调缴核算使用会计科目（）",
          "options": {
            "D": "其他应收款",
            "C": "存放同业",
            "B": "运送中现金",
            "A": "库存现金"
          },
          "answer": "B",
          "knowledge": "调缴账务核算"
        },
        {
          "question": "本行与总行、人行发行库调缴，在途现金核销时限要求（）",
          "options": {
            "A": "T+1日",
            "B": "当日",
            "C": "T+3日",
            "D": "T+7日"
          },
          "answer": "B",
          "knowledge": "运送中现金时限管控"
        },
        {
          "question": "普通行内机构间现金调缴，运送中现金最长核销时限（）",
          "options": {
            "A": "当日",
            "B": "T+1",
            "C": "T+3日",
            "D": "年末前"
          },
          "answer": "C",
          "knowledge": "运送中现金时限管控"
        },
        {
          "question": "年末“运送中现金”科目要求（）",
          "options": {
            "D": "分支行审批可跨年",
            "C": "5万元以下可跨年",
            "B": "不得有余额，禁止跨年度调缴",
            "A": "可留有小额余额"
          },
          "answer": "B",
          "knowledge": "年末账务管控"
        },
        {
          "question": "调入机构为分支行库/片区库，当日未能清点的调缴款，最晚（）完成确认入账",
          "options": {
            "A": "当日",
            "B": "次日",
            "C": "T+3",
            "D": "3个工作日"
          },
          "answer": "B",
          "knowledge": "现金入库清点时限"
        },
        {
          "question": "现金调缴审批人由（）担任",
          "options": {
            "D": "库管员",
            "C": "解款员",
            "B": "机构负责人/会计主管",
            "A": "普通现金柜员"
          },
          "answer": "B",
          "knowledge": "岗位职责-调缴审批人"
        },
        {
          "question": "现金调缴计划在“已出库”状态撤销，需要（）审批同意",
          "options": {
            "D": "无需审批",
            "C": "申请+受理双方有权人",
            "B": "仅受理机构",
            "A": "仅申请机构"
          },
          "answer": "C",
          "knowledge": "调缴计划撤销规则"
        },
        {
          "question": "行内调缴现金封装要求（）",
          "options": {
            "D": "仅大额款项封箱",
            "C": "无需封签，仅登记数量",
            "B": "双人加锁、一次性封签/封扣",
            "A": "单人上锁、普通胶带封口"
          },
          "answer": "B",
          "knowledge": "款箱封装管理"
        },
        {
          "question": "不属于现金调缴不相容岗位的是（）",
          "options": {
            "D": "解款员与押运司机",
            "C": "库管员与调缴复核员",
            "B": "现金柜员与调缴复核员",
            "A": "库管员与记账员（网点库除外）"
          },
          "answer": "D",
          "knowledge": "不相容岗位分离"
        },
        {
          "question": "行内调缴清点长短款，差错（）以下为普通差错",
          "options": {
            "A": "1万元",
            "B": "2万元",
            "C": "5万元",
            "D": "10万元"
          },
          "answer": "B",
          "knowledge": "差错分级标准"
        },
        {
          "question": "现金差错金额（）以上为重大差错，24小时内书面上报总行",
          "options": {
            "A": "2万",
            "B": "10万",
            "C": "20万",
            "D": "50万"
          },
          "answer": "C",
          "knowledge": "差错分级上报要求"
        },
        {
          "question": "长款挂账满（）无法查明，经财务分管行领导审批年终转营业外收入",
          "options": {
            "A": "3个月",
            "B": "半年",
            "C": "1年",
            "D": "2年"
          },
          "answer": "C",
          "knowledge": "长短款账务处理"
        },
        {
          "question": "短款挂账期限最长不得超过（）",
          "options": {
            "A": "1个月",
            "B": "3个月",
            "C": "半年",
            "D": "1年"
          },
          "answer": "A",
          "knowledge": "长短款账务处理"
        },
        {
          "question": "分支行对辖内机构现金调缴检查频次（）",
          "options": {
            "D": "每月抽查",
            "C": "半年抽查",
            "B": "每年全覆盖",
            "A": "每季度全覆盖"
          },
          "answer": "B",
          "knowledge": "监督检查频次"
        },
        {
          "question": "无实物库机构现金调缴操作人是（）",
          "options": {
            "D": "解款员",
            "C": "会计主管",
            "B": "任一现金柜员",
            "A": "仅库管员"
          },
          "answer": "B",
          "knowledge": "不同库类型操作权限"
        }
      ],
      "multi": [
        {
          "question": "现金调缴分为两大类（）",
          "options": {
            "D": "柜面现金整点",
            "C": "ATM现金调拨",
            "B": "行外现金调缴",
            "A": "行内现金调缴"
          },
          "answer": "AB",
          "knowledge": "现金调缴分类"
        },

let ALL_QUESTIONS = [];
let ALL_RECITE = [];
(function buildAllQuestions(){
    let qid = 0, rid = 0;
    QUIZ_DATA.modules.forEach((mod, mi) => {
        mod.single.forEach(q => { q.qid = qid++; q.type = 'single'; q.moduleIdx = mi; ALL_QUESTIONS.push(q); });
        mod.multi.forEach(q => { q.qid = qid++; q.type = 'multi'; q.moduleIdx = mi; ALL_QUESTIONS.push(q); });
        mod.judge.forEach(q => { q.qid = qid++; q.type = 'judge'; q.moduleIdx = mi; ALL_QUESTIONS.push(q); });
        mod.recite.forEach(g => { g.rid = rid++; g.moduleIdx = mi; g.moduleName = mod.name; ALL_RECITE.push(g); });
    });
})();

// ====== 用户/存储层（工号分片） ======
const ROOT_KEY = 'quiz_users_list';
function getStorageKey(base) {
    let uid = app.user || (window.PLATFORM_USER_ID || '') || 'guest';
    return 'quiz_' + base + '_' + uid;
}
function getUserList() {
    try { return JSON.parse(localStorage.getItem(ROOT_KEY) || '[]'); } catch(e) { return []; }
}
function saveUserList(list) { localStorage.setItem(ROOT_KEY, JSON.stringify(list)); }
function loadUserData() {
    let raw = localStorage.getItem(getStorageKey('data'));
    if (raw) { try { return JSON.parse(raw); } catch(e) {} }
    return { answered: {}, userAnswers: {}, wrongBook: {}, reciteMastery: {}, reciteRevealed: {} };
}
function saveUserData() { localStorage.setItem(getStorageKey('data'), JSON.stringify(userData)); }
let userData = { answered:{}, userAnswers:{}, wrongBook:{}, reciteMastery:{}, reciteRevealed:{} };
function getCurrentUserId() { return app.user || window.PLATFORM_USER_ID || ''; }

// ====== 初始化 ======
function init() {
    // 移动端视口高度兜底：用 innerHeight 设置 CSS 变量，防止地址栏遮挡底部
    function setVH(){ document.documentElement.style.setProperty('--vh', window.innerHeight + 'px'); }
    setVH();
    window.addEventListener('resize', setVH);
    window.addEventListener('orientationchange', function(){ setTimeout(setVH, 200); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', setVH);

    let last = localStorage.getItem('quiz_last_user');
    if (last) { app.user = last; userData = loadUserData(); }
    else { setTimeout(openUserModal, 100); }
    renderModuleBar();
    applyFilter();
    updateUserBox();
}

// ====== 用户弹窗 ======
function openUserModal() {
    $('userModal').classList.add('active');
    $('userInput').value = '';
    setTimeout(() => $('userInput').focus(), 100);
}
function closeUserModal() { $('userModal').classList.remove('active'); }
function selectUser(u) {
    app.user = u;
    userData = loadUserData();
    localStorage.setItem('quiz_last_user', u);
    // 确保用户在列表里（防止程序化调用遗漏）
    let list = getUserList();
    if (!list.includes(u)) { list.push(u); saveUserList(list); }
    closeUserModal();
    updateUserBox();
    applyFilter();
}
function confirmUser() {
    let u = $('userInput').value.trim();
    if (!u) { alert('请输入工号'); return; }
    let list = getUserList();
    if (!list.includes(u)) { list.push(u); saveUserList(list); }
    selectUser(u);
}
function updateUserBox() { $('userName').textContent = app.user ? app.user : '未登录'; }

// ====== 模块栏（下拉框） ======
function renderModuleBar() {
    let sel = $('moduleSelect');
    sel.innerHTML = QUIZ_DATA.modules.map((m, i) => {
        let short = shortName(m.name);
        return `<option value="${i}">${i+1}. ${short}</option>`;
    }).join('');
    sel.value = app.moduleIdx;
}
function shortName(full) {
    let m = full.match(/[（(](.+?)[）)]/);
    return m ? m[1] : full.slice(0, 8);
}
function switchModule(i) {
    app.moduleIdx = parseInt(i);
    app.pos = 0;
    // 错题本模式下切模块，先退出错题本
    if (app.wrongBookOnly) { app.wrongBookOnly = false; syncWrongBookBtn(); }
    applyFilter();
    // 自动跳到本模块第一个未做的题
    jumpToFirstUnanswered();
}

function applyFilter() {
    let list = [];
    if (app.wrongBookOnly) {
        // 错题本模式：跨模块显示所有错题
        ALL_QUESTIONS.forEach(q => {
            if (userData.wrongBook[q.qid]) list.push({kind:'question', qid:q.qid, ref:q});
        });
    } else {
        ALL_QUESTIONS.forEach(q => {
            if (q.moduleIdx !== app.moduleIdx) return;
            list.push({kind:'question', qid:q.qid, ref:q});
        });
        ALL_RECITE.forEach(g => { if (g.moduleIdx === app.moduleIdx) list.push({kind:'recite', rid:g.rid, ref:g}); });
    }
    app.filteredList = list;
    app.pos = 0;
    app.selected = [];
    renderAll();
}

// ====== 模式切换 ======
function switchMode(m) {
    app.mode = m;
    app.pos = 0;
    app.selected = [];
    if (app.wrongBookOnly) { app.wrongBookOnly = false; syncWrongBookBtn(); }
    ['test','review'].forEach(x => $('mode-' + x).classList.toggle('active', x === m));
    applyFilter();
    jumpToFirstUnanswered();
}

// ====== 渲染主流程 ======
function renderAll() {
    let list = app.filteredList;
    if (list.length === 0) {
        $('contentArea').innerHTML = '<div style="text-align:center;color:#a0aec0;padding:40px">暂无错题<br><span style="font-size:12px">继续加油！</span></div>';
        updateSummary(0, 0);
        updateFooter();
        renderQGrid();
        updateStats();
        return;
    }
    if (app.pos >= list.length) app.pos = list.length - 1;
    if (app.pos < 0) app.pos = 0;
    let item = list[app.pos];
    if (item.kind === 'question') renderQuestion(item.ref);
    else renderRecite(item.ref);
    updateSummary(app.pos + 1, list.length);
    updateFooter();
    renderQGrid();
    updateStats();
}

function renderQuestion(q) {
    app.selected = (userData.userAnswers[q.qid] || []).slice();
    let already = userData.answered[q.qid] !== undefined;
    let typeName = {single:'单选题', multi:'多选题', judge:'判断题'}[q.type];
    let optsHtml = '';
    let keys = ['A','B','C','D','E'];
    let ansArr = String(q.answer).split('');
    keys.forEach(k => {
        if (!q.options[k]) return;
        let isCorrect = ansArr.includes(k);
        let isUserSel = app.selected.includes(k);
        let cls = 'option-item';
        let tag = '';
        if (app.mode === 'review') {
            cls += ' disabled';
            if (isCorrect) { cls += ' correct'; tag = '<span class="option-tag" style="color:#38a169">✓</span>'; }
        } else if (app.mode === 'test' && already) {
            cls += ' disabled';
            if (isCorrect) { cls += ' correct'; tag = '<span class="option-tag" style="color:#38a169">✓</span>'; }
            else if (isUserSel) { cls += ' wrong-selected'; tag = '<span class="option-tag" style="color:#c53030">✗</span>'; }
        } else if (isUserSel) { cls += ' selected'; }
        optsHtml += `<div class="${cls}" data-k="${k}" ${(!already && app.mode==='test') ? 'onclick="onOptionClick(\''+k+'\')"' : ''}><span class="option-letter">${k}</span><span>${q.options[k]}</span>${tag}</div>`;
    });
    // 移除原题内提交按钮（提交按钮已移到底部固定栏）
    let extraBtn = '';
    if (app.mode === 'test' && userData.wrongBook[q.qid]) {
        extraBtn = `<button class="remove-wrong-btn" onclick="removeFromWrongBook(${q.qid})">✓ 已掌握，移出错题本</button>`;
    }
    let noteHtml = q.note ? `<div class="question-note" style="display:block">💡 ${q.note}</div>` : '';
    let moduleTag = app.wrongBookOnly && q.moduleIdx !== undefined ? `<span style="font-size:11px;color:#3182ce;background:#ebf8ff;border-radius:3px;padding:1px 6px;flex-shrink:0">模块${q.moduleIdx+1}</span>` : '';
    $('contentArea').innerHTML = `<div class="question-card"><div class="question-meta"><span class="question-type ${q.type}">${typeName}</span>${moduleTag}<span class="question-category">${q.knowledge || ''}</span></div><div class="question-text">${q.question}</div>${noteHtml}<div class="options-list">${optsHtml}</div>${extraBtn}</div>`;
}

function renderRecite(g) {
    let mastery = userData.reciteMastery[g.rid] || 0;
    let revealed = userData.reciteRevealed[g.rid] || [];
    let itemsHtml = g.items.map((item, ii) => {
        let html = app.maskOn ? maskText(item, g.rid, ii, revealed) : item;
        return `<div class="recite-item">${html}</div>`;
    }).join('');
    let masteryHtml = app.mode !== 'recite' ? '' : `<div class="recite-toolbar"><span class="mastery-label">熟练度：</span><span class="mastery-dot"><button class="mastery-btn m1 ${mastery!==1?'inactive':''}" title="需反复" onclick="setMastery(${g.rid},1)"></button><button class="mastery-btn m2 ${mastery!==2?'inactive':''}" title="复习中" onclick="setMastery(${g.rid},2)"></button><button class="mastery-btn m3 ${mastery!==3?'inactive':''}" title="已掌握" onclick="setMastery(${g.rid},3)"></button></span><span class="mastery-label">${['','需反复','复习中','已掌握'][mastery]||'未标记'}</span></div>`;
    $('contentArea').innerHTML = `<div class="recite-card"><div class="recite-group-title" onclick="toggleReciteCollapse(this)"><span class="arrow">▼</span><span>${g.group}</span><span style="font-size:11px;color:#a0aec0;font-weight:normal;margin-left:auto">${g.items.length}条</span></div><div class="recite-items">${itemsHtml}</div>${masteryHtml}</div>`;
}

function maskText(text, rid, itemIdx, revealed) {
    let pattern = /(\d+(?:\.\d+)?\s*(?:元|万元|万元以下|个工作日|个工作日内|日|天|月|个月|年|年以下|%|％|张|个|次|人|类|户|种类)|[ⅠⅡⅢⅣⅤ]+类?|[Tt]\+\d+)/g;
    let matches = [], m, lastIdx = 0, result = '';
    while ((m = pattern.exec(text)) !== null) {
        result += text.slice(lastIdx, m.index);
        let key = rid + '_' + itemIdx + '_' + matches.length;
        let isRevealed = revealed.includes(key);
        if (isRevealed) result += `<span class="mask revealed" onclick="revealMask('${rid}','${key}')">${m[0]}</span>`;
        else result += `<span class="mask" onclick="revealMask('${rid}','${key}')">${'■'.repeat(Math.min(m[0].length, 4))}</span>`;
        lastIdx = m.index + m[0].length;
        matches.push(m[0]);
    }
    result += text.slice(lastIdx);
    return result;
}

function revealMask(rid, key) {
    if (!userData.reciteRevealed[rid]) userData.reciteRevealed[rid] = [];
    if (!userData.reciteRevealed[rid].includes(key)) { userData.reciteRevealed[rid].push(key); saveUserData(); }
    let item = app.filteredList[app.pos];
    if (item && item.kind === 'recite') renderRecite(item.ref);
}

function toggleReciteCollapse(el) {
    el.classList.toggle('collapsed');
    el.nextElementSibling.classList.toggle('collapsed');
}

function setMastery(rid, level) {
    userData.reciteMastery[rid] = level;
    saveUserData();
    let item = app.filteredList[app.pos];
    if (item && item.kind === 'recite') renderRecite(item.ref);
    renderQGrid();
}

// ====== 选项点击 ======
function onOptionClick(k) {
    let item = app.filteredList[app.pos];
    if (!item || item.kind !== 'question') return;
    let q = item.ref;
    if (q.type === 'single' || q.type === 'judge') app.selected = [k];
    else if (q.type === 'multi') {
        if (app.selected.includes(k)) app.selected = app.selected.filter(x => x !== k);
        else app.selected.push(k);
    }
    document.querySelectorAll('.option-item').forEach(el => el.classList.toggle('selected', app.selected.includes(el.dataset.k)));
    updateFooter();
}

// ====== 提交答案 ======
function submitAnswer() {
    let item = app.filteredList[app.pos];
    if (!item || item.kind !== 'question') return;
    let q = item.ref;
    let already = userData.answered[q.qid] !== undefined;
    if (already) { goQuestion(1); return; } // 已答时底部按钮变成"下一题"，直接下一题
    if (app.selected.length === 0) return;
    let userAns = app.selected.slice().sort().join('');
    let realAns = String(q.answer).split('').sort().join('');
    let isRight = userAns === realAns;
    userData.answered[q.qid] = isRight;
    userData.userAnswers[q.qid] = app.selected.slice();
    if (!isRight) userData.wrongBook[q.qid] = true;
    saveUserData();
    renderQuestion(q);
    updateFooter();
    $('fbIcon').className = 'modal-icon ' + (isRight ? 'correct' : 'incorrect');
    $('fbIcon').textContent = isRight ? '✓' : '✗';
    $('fbMsg').textContent = isRight ? getRandomEncouragement() : '仔细看看正确答案';
    $('fbAnswer').textContent = '正确答案：' + q.answer;
    $('feedbackModal').classList.add('active');
}
function closeFeedback() { $('feedbackModal').classList.remove('active'); }
function closeFeedbackAndNext() { $('feedbackModal').classList.remove('active'); goQuestion(1); }
function getRandomEncouragement() {
    const arr = ['太棒了！继续加油~','正确！掌握得很扎实','非常好！知识点理解到位','厉害！保持这个状态','完美！这道题答得很棒','稳了，这题拿捏了','完全正确','满分作答','正解，被你找到了','高手，一眼就看穿','回答精准，无可挑剔','可以啊，全答对','答对了，真的很棒'];
    return arr[Math.floor(Math.random() * arr.length)];
}

// ====== 错题本 ======
function toggleWrongBook() {
    app.wrongBookOnly = !app.wrongBookOnly;
    applyFilter();
    if (!app.wrongBookOnly) jumpToFirstUnanswered();
}
function removeFromWrongBook(qid) {
    delete userData.wrongBook[qid];
    saveUserData();
    let item = app.filteredList[app.pos];
    if (item && item.kind === 'question') renderQuestion(item.ref);
    renderQGrid();
    updateSummary(app.pos + 1, app.filteredList.length);
    updateFooter();
}

// ====== 遮罩（保留接口，无UI入口） ======
function toggleMask() {
    app.maskOn = !app.maskOn;
    let item = app.filteredList[app.pos];
    if (item && item.kind === 'recite') renderRecite(item.ref);
}

// ====== 题号网格（只显示当前题附近+汇总） ======
function renderQGrid() {
    let grid = $('qgrid');
    let list = app.filteredList;
    let cur = app.pos;
    let html = '';
    if (list.length === 0) {
        html = '<div style="font-size:11px;color:#a0aec0;padding:4px">暂无题目</div>';
    } else {
        // 显示范围：当前题前2题到后2题，前面/后面用省略号
        let start = Math.max(0, cur - 2);
        let end = Math.min(list.length, cur + 3);
        if (start > 0) html += '<div class="q-dot ellipsis">…</div>';
        for (let i = start; i < end; i++) {
            let item = list[i];
            let cls = 'q-dot';
            let title = '';
            if (i === cur) cls += ' current';
            if (item.kind === 'question') {
                let qid = item.qid;
                let ans = userData.answered[qid];
                if (ans === true) cls += ' right';
                else if (ans === false) cls += ' wrong';
                if (userData.wrongBook[qid]) cls += ' in-wrong-book';
                title = item.ref.question.slice(0, 30);
            } else {
                cls += ' recite';
                let mst = userData.reciteMastery[item.rid];
                if (mst === 3) cls += ' right';
                else if (mst === 1) cls += ' wrong';
                title = item.ref.group;
            }
            html += `<div class="${cls}" title="${title}" onclick="jumpTo(${i})">${i+1}</div>`;
        }
        if (end < list.length) html += '<div class="q-dot ellipsis">…</div>';
    }
    // 汇总统计
    let rightCnt = 0, wrongCnt = 0, unansCnt = 0;
    list.forEach(item => {
        if (item.kind === 'question') {
            let a = userData.answered[item.qid];
            if (a === true) rightCnt++;
            else if (a === false) wrongCnt++;
            else unansCnt++;
        } else {
            let mst = userData.reciteMastery[item.rid];
            if (mst === 3) rightCnt++;
            else if (mst === 1) wrongCnt++;
            else unansCnt++;
        }
    });
    html += `<div class="q-stats">共${list.length}题 ｜ 🟩${rightCnt} ｜ 🟥${wrongCnt} ｜ ⬜${unansCnt}</div>`;
    grid.innerHTML = html;
    syncWrongBookBtn();
}
function updateWrongCount() { let el = $('wrongCount'); if (el) el.textContent = Object.keys(userData.wrongBook || {}).length; }
function jumpTo(i) { app.pos = i; app.selected = []; renderAll(); }

// ====== 导航 ======
function goQuestion(dir) {
    let np = app.pos + dir;
    if (np < 0 || np >= app.filteredList.length) return;
    app.pos = np;
    app.selected = [];
    renderAll();
}

// ====== 跳转到当前筛选列表中第一个未做的题 ======
function jumpToFirstUnanswered() {
    let list = app.filteredList;
    if (!list || list.length === 0) return;
    let firstIdx = list.findIndex(item => {
        if (item.kind === 'question') return userData.answered[item.qid] === undefined;
        return true; // 背诵知识点默认算未做
    });
    if (firstIdx === -1) firstIdx = 0; // 全部做完了就回到第1题
    app.pos = firstIdx;
    app.selected = [];
    renderAll();
}

// ====== 同步两个错题本按钮的状态（详情区+摘要区） ======
function syncWrongBookBtn() {
    let count = Object.keys(userData.wrongBook || {}).length;
    // 详情区按钮
    let detailBtn = $('wrongBookBtn');
    if (detailBtn) {
        if (app.wrongBookOnly) {
            detailBtn.innerHTML = '← 返回全部题目';
            detailBtn.style.background = '#e53e3e';
            detailBtn.style.color = '#fff';
        } else {
            detailBtn.innerHTML = '📕 只看错题（<span id="wrongCount">' + count + '</span>）';
            detailBtn.style.background = '#fff';
            detailBtn.style.color = '#e53e3e';
        }
    }
    // 摘要区按钮
    let sumBtn = $('sumWrongBook');
    if (sumBtn) {
        if (app.wrongBookOnly) {
            sumBtn.textContent = '📕返回全部(' + count + ')';
            sumBtn.style.background = '#e53e3e';
            sumBtn.style.color = '#fff';
        } else {
            sumBtn.textContent = '📕错题本(' + count + ')';
            sumBtn.style.background = '#fff';
            sumBtn.style.color = '#e53e3e';
        }
    }
    updateWrongCount();
}

// ====== 摘要区错题本按钮快捷切换 ======
function quickToggleWrongBook() {
    app.wrongBookOnly = !app.wrongBookOnly;
    applyFilter();
    if (!app.wrongBookOnly) jumpToFirstUnanswered();
}

// ====== 顶部信息栏摘要更新 ======
function updateSummary(curNo, total) {
    let posText = total > 0 ? `第${curNo}/${total}题` : '无题目';
    if (app.wrongBookOnly) posText = '错题本 ' + posText;
    $('sumPos').textContent = posText;
    // 同步滑块
    let slider = $('posSlider');
    if (slider) {
        slider.max = Math.max(1, total);
        slider.value = Math.min(Math.max(1, curNo), total > 0 ? total : 1);
        slider.disabled = total <= 0;
    }
    syncWrongBookBtn();
}

// ====== 摘要行滑块拖动跳题 ======
function onSliderInput(val) {
    let idx = parseInt(val) - 1;
    if (idx < 0 || idx >= app.filteredList.length) return;
    app.pos = idx;
    app.selected = [];
    let item = app.filteredList[app.pos];
    if (item && item.kind === 'question') renderQuestion(item.ref);
    else if (item && item.kind === 'recite') renderRecite(item.ref);
    // 实时更新进度文字，但不调用renderAll（避免重置滑块焦点）
    $('sumPos').textContent = (app.wrongBookOnly ? '错题本 ' : '') + `第${idx+1}/${app.filteredList.length}题`;
    $('prev').disabled = app.pos <= 0;
    $('next').disabled = app.pos >= app.filteredList.length - 1;
    // 更新底部提交按钮状态
    let submitBtn = $('footerSubmit');
    if (item && item.kind === 'question' && app.mode === 'test') {
        let already = userData.answered[item.qid] !== undefined;
        submitBtn.disabled = already ? false : (app.selected.length === 0);
        submitBtn.textContent = already ? '下一题' : '确认答案';
    } else if (item && item.kind === 'recite') {
        submitBtn.disabled = true; submitBtn.textContent = '知识点';
    } else if (app.mode === 'review') {
        submitBtn.disabled = true; submitBtn.textContent = '复习模式';
    }
    renderQGrid();
}

// ====== 底部按钮状态更新 ======
function updateFooter() {
    let list = app.filteredList;
    let item = list[app.pos];
    $('prev').disabled = app.pos <= 0;
    $('next').disabled = app.pos >= list.length - 1;
    let submitBtn = $('footerSubmit');
    if (!item) { submitBtn.disabled = true; submitBtn.textContent = '确认答案'; return; }
    if (item.kind === 'recite') {
        // 背诵知识点：底部按钮显示提示，用上一题/下一题导航
        submitBtn.disabled = true;
        submitBtn.textContent = '知识点';
    } else if (app.mode === 'review') {
        submitBtn.disabled = true;
        submitBtn.textContent = '复习模式';
    } else if (app.mode === 'test') {
        let already = userData.answered[item.qid] !== undefined;
        if (already) {
            submitBtn.disabled = false;
            submitBtn.textContent = '下一题';
        } else {
            submitBtn.disabled = app.selected.length === 0;
            submitBtn.textContent = '确认答案';
        }
    }
}

// ====== 统计 ======
function updateStats() {
    let answeredCount = 0, rightCount = 0;
    Object.values(userData.answered).forEach(v => { if (v === true) { rightCount++; answeredCount++; } else if (v === false) answeredCount++; });
    // 统计区已合并到信息栏摘要，这里不再单独更新
}

// ====== 工具 ======
function $(id) { return document.getElementById(id); }

// 启动
init();
</script>
